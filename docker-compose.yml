name: ${DOCKER_PROJECT_NAME:-testapp2}

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_VERSION: ${APP_VERSION:-0.1.0}
    container_name: ${FRONTEND_CONTAINER:-testapp2-frontend}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: ${BACKEND_CONTAINER:-testapp2-backend}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DEV_ADMIN_TOKEN: ${DEV_ADMIN_TOKEN:-change-me-admin-token}
      DEV_ALLOWED_TOKEN: ${DEV_ALLOWED_TOKEN:-change-me-host-token}
      DEV_HOST_API_URL: ${DEV_HOST_API_URL:-http://host.docker.internal:4878}
      DEV_REQUEST_TIMEOUT_MS: ${DEV_REQUEST_TIMEOUT_MS:-120000}
      USER_DATA_PATH: ${USER_DATA_PATH:-/data/users.json}
      RUNTIME_PATH: ${RUNTIME_PATH:-/app/runtime}
      APP_CUSTOMIZATION_PATH: ${APP_CUSTOMIZATION_PATH:-/app/runtime/app-config.json}
      APP_UPLOADS_PATH: ${APP_UPLOADS_PATH:-/app/runtime/uploads}
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-a-very-long-random-session-secret}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-testapp2_session}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Administrateur}
    volumes:
      - user-data:/data
      - runtime-data:/app/runtime
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  user-data:
  runtime-data:
